<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Image-to-3D Viewer</title>
<style>
	:root {
		--bg: #15171a; --panel: #1d2024; --line: #2c3036; --text: #e6e3dc; --muted: #9a978f;
		--accent: #d9a441; --ok: #6fbf73; --over: #e0675a;
	}
	* { box-sizing: border-box; }
	body { margin: 0; height: 100vh; display: grid; grid-template-columns: 300px 1fr; background: var(--bg);
		color: var(--text); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
	aside { background: var(--panel); border-right: 1px solid var(--line); padding: 14px; overflow-y: auto; }
	h1 { font-size: 15px; margin: 0 0 12px; letter-spacing: .02em; }
	h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 6px; }
	.model { display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent;
		color: var(--text); padding: 6px 8px; border-radius: 6px; cursor: pointer; font: inherit; }
	.model:hover { background: #262a2f; }
	.model[aria-current="true"] { border-color: var(--accent); background: #2a2620; }
	.model small { color: var(--muted); display: block; font-size: 12px; }
	.row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
	.row button, .row select { background: #262a2f; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
		padding: 5px 9px; font: inherit; cursor: pointer; }
	.row button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
	main { position: relative; }
	canvas { display: block; width: 100%; height: 100%; }
	#source { position: absolute; right: 14px; top: 14px; width: min(28vw, 320px); border: 1px solid var(--line);
		border-radius: 8px; background: #000; }
	#source img { display: block; width: 100%; border-radius: 8px 8px 0 0; }
	#source figcaption { font-size: 12px; color: var(--muted); padding: 6px 8px; }
	#stats { position: absolute; left: 14px; bottom: 14px; background: rgba(20,22,25,.85); border: 1px solid var(--line);
		border-radius: 8px; padding: 8px 10px; font: 12px/1.5 ui-monospace, monospace; white-space: pre; }
	.ok { color: var(--ok); } .over { color: var(--over); }
	body.shot { grid-template-columns: 1fr !important; grid-template-rows: 1fr !important; }
	body.shot aside, body.shot #source, body.shot #stats { display: none; }
	@media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; } #source { width: 34vw; } }
</style>
<script type="importmap">
{ "imports": {
	"three": "./node_modules/three/build/three.module.js",
	"three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<aside>
	<h1>Image-to-3D feasibility</h1>
	<div class="row" role="group" aria-label="Variant">
		<button data-variant="optimized" aria-pressed="true">Optimized</button>
		<button data-variant="raw" aria-pressed="false">Raw</button>
	</div>
	<div class="row">
		<button id="spin" aria-pressed="true">Turntable</button>
		<button id="wire" aria-pressed="false">Wireframe</button>
	</div>
	<div class="row" id="animRow" hidden>
		<select id="anim" aria-label="Animation"></select>
	</div>
	<div id="list"></div>
</aside>
<main>
	<canvas id="c"></canvas>
	<figure id="source"><img alt="Source art for the selected model" /><figcaption></figcaption></figure>
	<div id="stats"></div>
</main>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const params = new URLSearchParams(location.search);
const shot = params.has('shot');
if (shot) document.body.classList.add('shot');

const index = await (await fetch('work/models/index.json')).json();
const facing = await (await fetch('facing.json')).json();
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: shot });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2f36);
scene.fog = new THREE.Fog(0x2a2f36, 6, 16);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;

// Game-like lighting: cool sky fill, warm low key light with shadows, rim light from behind.
scene.add(new THREE.HemisphereLight(0xc8dcff, 0x4a3b2c, 1.6));
const key = new THREE.DirectionalLight(0xffe2b8, 2.6);
key.position.set(3, 4.5, 2.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2, near: 0.5, far: 15 });
key.shadow.bias = -0.0005;
scene.add(key);
const rim = new THREE.DirectionalLight(0x9fc2ff, 1.4);
rim.position.set(-3, 2.5, -3.5);
scene.add(rim);
const ground = new THREE.Mesh(new THREE.CircleGeometry(4, 64), new THREE.MeshStandardMaterial({ color: 0x3b3f36, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 50);
camera.position.set(0, 0.9, 2.6);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.5, 0);
controls.enableDamping = true;

const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const pivot = new THREE.Group();
scene.add(pivot);
let mixer = null, clips = [], spin = !shot, wire = false, variant = params.get('variant') ?? 'optimized', current = null;

function resize() {
	const { clientWidth: w, clientHeight: h } = canvas.parentElement;
	renderer.setSize(w, h, false);
	camera.aspect = w / h;
	camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

const list = document.getElementById('list');
const bySubject = Object.groupBy(index.models, (m) => m.subject);
for (const [subject, models] of Object.entries(bySubject)) {
	const h = document.createElement('h2');
	h.textContent = models[0].label;
	list.append(h);
	for (const m of models) {
		const b = document.createElement('button');
		b.className = 'model';
		b.dataset.key = m.key;
		const o = m.metrics?.optimized;
		b.innerHTML = `${m.toolLabel}<small>${o ? `${o.triangles.toLocaleString()} tris · ${(o.bytes / 1024).toFixed(0)} KB` : 'not optimized'}${m.metrics?.optimized?.animations?.length ? ' · animated' : ''}</small>`;
		b.onclick = () => show(m);
		list.append(b);
	}
}
document.querySelectorAll('[data-variant]').forEach((b) => (b.onclick = () => {
	variant = b.dataset.variant;
	document.querySelectorAll('[data-variant]').forEach((x) => x.setAttribute('aria-pressed', x === b));
	if (current) show(current);
}));
document.getElementById('spin').onclick = (e) => { spin = !spin; e.target.setAttribute('aria-pressed', spin); };
document.getElementById('wire').onclick = (e) => {
	wire = !wire; e.target.setAttribute('aria-pressed', wire);
	pivot.traverse((o) => o.material && (o.material.wireframe = wire));
};
const animSel = document.getElementById('anim');
animSel.onchange = () => play(animSel.value);

function play(name) {
	if (!mixer) return;
	mixer.stopAllAction();
	const clip = clips.find((c) => c.name === name);
	if (clip) mixer.clipAction(clip).play();
}

async function show(m) {
	current = m;
	document.querySelectorAll('.model').forEach((b) => b.setAttribute('aria-current', b.dataset.key === m.key));
	const file = variant === 'raw' ? m.raw : (m.animated ?? m.optimized ?? m.raw);
	const gltf = await loader.loadAsync(file);
	pivot.clear();
	const root = new THREE.Group();
	gltf.scene.rotation.y = ((facing[m.key] ?? 0) * Math.PI) / 180;
	root.add(gltf.scene);
	root.updateMatrixWorld(true);
	// Normalize: fit to ~1.1 units tall (props 0.8), stand on the ground, center on the turntable.
	const box = new THREE.Box3().setFromObject(root);
	const size = box.getSize(new THREE.Vector3());
	const target = m.kind === 'prop' ? 0.8 : 1.1;
	const s = target / Math.max(size.y, size.x * 0.75, size.z * 0.75);
	root.scale.setScalar(s);
	const c = box.getCenter(new THREE.Vector3()).multiplyScalar(s);
	root.position.set(-c.x, -box.min.y * s, -c.z);
	root.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; if (wire) o.material.wireframe = true; } });
	pivot.add(root);
	pivot.rotation.y = shot ? Number(params.get('angle') ?? 0) * Math.PI / 180 : 0;
	controls.target.set(0, (box.max.y - box.min.y) * s * 0.5, 0);
	mixer = gltf.animations.length ? new THREE.AnimationMixer(gltf.scene) : null;
	clips = gltf.animations;
	document.getElementById('animRow').hidden = !clips.length;
	animSel.innerHTML = clips.map((c) => `<option>${c.name}</option>`).join('');
	if (clips.length) play(params.get('clip') ?? clips[0].name);
	const img = document.querySelector('#source img');
	img.src = m.sourcePreview;
	document.querySelector('#source figcaption').textContent = `${m.label} · source (left) and clean input (right)`;
	const mt = m.metrics;
	const fmt = (v) => v ? `${v.triangles.toLocaleString().padStart(7)} tris  ${(v.bytes / 1024).toFixed(0).padStart(6)} KB  tex ${v.textures.map((t) => t.size).join(',') || 'none'}` : 'n/a';
	document.getElementById('stats').innerHTML = `${m.toolLabel} — ${m.label}\nraw       ${fmt(mt?.raw)}\noptimized ${fmt(mt?.optimized)}\n` +
		(mt ? `budget    ${mt.budget.tris.toLocaleString()} tris / ${(mt.budget.bytes / 1024).toFixed(0)} KB  <span class="${mt.withinBudget ? 'ok' : 'over'}">${mt.withinBudget ? 'within budget' : 'over budget'}</span>\n` : '') +
		(m.meta?.seconds ? `time      ${m.meta.seconds.total}s on ${m.meta.gpu}` : '');
	window.__ready = true;
}

resize();
const start = index.models.find((m) => m.key === params.get('model')) ?? index.models[0];
if (start) await show(start);
if (shot && params.has('t')) { mixer?.setTime(Number(params.get('t'))); }

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
	const dt = clock.getDelta();
	if (spin) pivot.rotation.y += dt * 0.5;
	if (mixer && !shot) mixer.update(dt);
	controls.update();
	renderer.render(scene, camera);
});
</script>
</body>
</html>
