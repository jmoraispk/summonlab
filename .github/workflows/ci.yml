name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: summonlab_test
          POSTGRES_USER: summonlab
          POSTGRES_PASSWORD: summonlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U summonlab -d summonlab_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://summonlab:summonlab@127.0.0.1:5432/summonlab_test
      TEST_DATABASE_URL: postgresql://summonlab:summonlab@127.0.0.1:5432/summonlab_test
      POLICY_MODE: scripted
      ENABLE_DEV_ROUTES: true
      SUMMONLAB_COMMIT_SHA: ${{ github.sha }}
      CI: true
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate American English
        run: pnpm check:american-english

      - name: Validate migrations
        run: pnpm db:migrate

      - name: Format
        run: pnpm format:check

      - name: Validate visual assets
        run: >-
          pnpm validate:wiki-skill-visual-catalog &&
          pnpm validate:repository-assets &&
          pnpm validate:summonable-hero-runtime &&
          pnpm validate:player-visuals &&
          pnpm validate:phone-performance

      - name: Validate private playtest gates
        run: >-
          pnpm validate:moderated-playtest &&
          pnpm validate:playtest-release

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: |
          # Art-production receipts seal this executable's exact path and bytes.
          sealed_node_path=$(node -p "require('./skills/summonlab-image-production/references/contract-v3.json').sealedLauncher.node.path")
          sealed_node_sha256=$(node -p "require('./skills/summonlab-image-production/references/contract-v3.json').sealedLauncher.node.sha256")
          curl --fail --silent --show-error --location \
            https://nodejs.org/dist/v24.14.1/node-v24.14.1-linux-x64.tar.xz \
            --output "$RUNNER_TEMP/sealed-node.tar.xz"
          tar -xJf "$RUNNER_TEMP/sealed-node.tar.xz" -C "$RUNNER_TEMP" \
            node-v24.14.1-linux-x64/bin/node
          echo "$sealed_node_sha256  $RUNNER_TEMP/node-v24.14.1-linux-x64/bin/node" | sha256sum --check
          sudo mkdir -p "$(dirname "$sealed_node_path")"
          sudo install -m 755 "$RUNNER_TEMP/node-v24.14.1-linux-x64/bin/node" "$sealed_node_path"
          PATH="$(dirname "$sealed_node_path"):$PATH" pnpm test

      - name: PostgreSQL integration tests
        run: pnpm test:integration

      - name: Production build
        run: pnpm build && pnpm validate:web-build-budget

      - name: Rehearse private playtest package
        run: pnpm rehearse:playtest-package --skip-build

      - name: Install Playwright Chromium
        run: pnpm --filter @summonlab/web exec playwright install --with-deps chromium

      - name: Browser smoke test
        run: pnpm test:e2e

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
