<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" role="img"><title>Affinity pairing matrix, ten affinities</title><desc>A four by four grid. The diagonal holds the four base affinities water, fire, wind and earth. The six cells above hold the dual affinities mist, ice, rot, lightning, magma and sand.</desc>
<rect x="0" y="0" width="680" height="480" rx="16" fill="#0F0F12"/>

<text x="197" y="54" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#9A9AA6">&#128167; Water</text>
<text x="323" y="54" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#9A9AA6">&#128293; Fire</text>
<text x="449" y="54" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#9A9AA6">&#127786;&#65039; Wind</text>
<text x="575" y="54" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#9A9AA6">&#9968;&#65039; Earth</text>

<text x="88" y="120" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#9A9AA6">&#128167; Water</text>
<text x="88" y="204" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#9A9AA6">&#128293; Fire</text>
<text x="88" y="288" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#9A9AA6">&#127786;&#65039; Wind</text>
<text x="88" y="372" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#9A9AA6">&#9968;&#65039; Earth</text>

<rect x="138" y="82" width="118" height="76" rx="10" fill="#0E2E4F" stroke="#3B8BD4" stroke-width="2"/>
<text x="197" y="106" text-anchor="middle" dominant-baseline="central" font-size="24">&#128167;</text>
<text x="197" y="130" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#B8DBF8">Water</text>
<text x="197" y="146" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#7EB2E0">Chill</text>

