<text x="323" y="146" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#B0B5BE">Shroud</text>

<rect x="390" y="82" width="118" height="76" rx="10" fill="#0D3A44" stroke="#4FC7D6" stroke-width="1"/>
