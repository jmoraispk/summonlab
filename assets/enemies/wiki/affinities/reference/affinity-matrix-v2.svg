<svg
	xmlns="http://www.w3.org/2000/svg"
	viewBox="0 0 860 660"
	role="img"
	aria-labelledby="matrix-title matrix-desc"
>
	<title id="matrix-title">Affinity pairing matrix</title>
	<desc id="matrix-desc">Rows and columns are Earth, Water, Fire, Wind. Four base affinities and six dual affinities make ten total affinities.</desc>
	<defs>
		<style>
			.background { fill: #10141d; }
			.grid { fill: #151c28; stroke: #3a4a63; stroke-width: 1; }
			.header { fill: #b8c5d8; font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; }
			.row-header { fill: #b8c5d8; font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; text-anchor: end; }
			.name { fill: #f3f6fb; font-family: system-ui, sans-serif; font-size: 17px; font-weight: 700; text-anchor: middle; }
			.meta { fill: #c3cedd; font-family: system-ui, sans-serif; font-size: 12px; text-anchor: middle; }
			.caption { fill: #9fadc2; font-family: system-ui, sans-serif; font-size: 15px; text-anchor: middle; }
		</style>
	</defs>

	<rect class="background" x="0" y="0" width="860" height="660" rx="24" />
	<text class="name" x="470" y="48">Affinity pairing matrix</text>
	<text class="caption" x="470" y="74">Upper triangle: every unique base-affinity pairing.</text>

	<text class="header" x="320" y="128">Earth</text>
	<text class="header" x="470" y="128">Water</text>
	<text class="header" x="620" y="128">Fire</text>
	<text class="header" x="770" y="128">Wind</text>
	<text class="row-header" x="180" y="187">Earth</text>
	<text class="row-header" x="180" y="277">Water</text>
	<text class="row-header" x="180" y="367">Fire</text>
	<text class="row-header" x="180" y="457">Wind</text>

	<rect class="grid" x="245" y="145" width="150" height="70" rx="10" fill="#3c2c1d" data-kind="base" data-name="Earth" />
	<text class="name" x="320" y="174">Earth</text>
	<text class="meta" x="320" y="197">Weight</text>
	<rect class="grid" x="395" y="145" width="150" height="70" rx="10" fill="#253824" data-kind="dual" data-name="Rot" data-parents="Earth|Water" data-status="Decay" />
	<text class="name" x="470" y="174">Rot</text>
	<text class="meta" x="470" y="197">Earth + Water · Decay</text>
	<rect class="grid" x="545" y="145" width="150" height="70" rx="10" fill="#552018" data-kind="dual" data-name="Magma" data-parents="Fire|Earth" data-status="Melt" />
	<text class="name" x="620" y="174">Magma</text>
	<text class="meta" x="620" y="197">Fire + Earth · Melt</text>
	<rect class="grid" x="695" y="145" width="150" height="70" rx="10" fill="#4a3c24" data-kind="dual" data-name="Sand" data-parents="Wind|Earth" data-status="Abrade" />
	<text class="name" x="770" y="174">Sand</text>
	<text class="meta" x="770" y="197">Wind + Earth · Abrade</text>

	<rect class="grid" x="245" y="235" width="150" height="70" rx="10" />
	<rect class="grid" x="395" y="235" width="150" height="70" rx="10" fill="#123859" data-kind="base" data-name="Water" />
	<text class="name" x="470" y="264">Water</text>
	<text class="meta" x="470" y="287">Chill</text>
	<rect class="grid" x="545" y="235" width="150" height="70" rx="10" fill="#445061" data-kind="dual" data-name="Mist" data-parents="Water|Fire" data-status="Shroud" />
	<text class="name" x="620" y="264">Mist</text>
	<text class="meta" x="620" y="287">Water + Fire · Shroud</text>
	<rect class="grid" x="695" y="235" width="150" height="70" rx="10" fill="#1d5260" data-kind="dual" data-name="Ice" data-parents="Water|Wind" data-status="Freeze" />
	<text class="name" x="770" y="264">Ice</text>
	<text class="meta" x="770" y="287">Water + Wind · Freeze</text>

	<rect class="grid" x="245" y="325" width="150" height="70" rx="10" />
	<rect class="grid" x="395" y="325" width="150" height="70" rx="10" />
	<rect class="grid" x="545" y="325" width="150" height="70" rx="10" fill="#531d17" data-kind="base" data-name="Fire" />
	<text class="name" x="620" y="354">Fire</text>
	<text class="meta" x="620" y="377">Burn</text>
	<rect class="grid" x="695" y="325" width="150" height="70" rx="10" fill="#4d421d" data-kind="dual" data-name="Lightning" data-parents="Fire|Wind" data-status="Shock" />
	<text class="name" x="770" y="354">Lightning</text>
	<text class="meta" x="770" y="377">Fire + Wind · Shock</text>

	<rect class="grid" x="245" y="415" width="150" height="70" rx="10" />
	<rect class="grid" x="395" y="415" width="150" height="70" rx="10" />
	<rect class="grid" x="545" y="415" width="150" height="70" rx="10" />
	<rect class="grid" x="695" y="415" width="150" height="70" rx="10" fill="#153f3c" data-kind="base" data-name="Wind" />
	<text class="name" x="770" y="444">Wind</text>
	<text class="meta" x="770" y="467">Lacerate</text>

	<text class="caption" x="470" y="562">4 base affinities + 6 dual affinities = 10 total affinities</text>
	<text class="caption" x="470" y="588">Each dual cell records its exact parents and signature status.</text>
</svg>
